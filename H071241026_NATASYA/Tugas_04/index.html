<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>🎴 UNO Game 🎴</h1>

        <div class="status">
            <p>Saldo: $<span id="saldo">5000</span></p>
            <p>Taruhan: $<span id="taruhan">0</span></p>
            <p>Ronde: <span id="ronde">0</span></p>
        </div>

        <div class="controls">
            <input type="number" id="betInput" placeholder="Masukkan taruhan (min 100)" min="100">
            <button id="startBtn">Mulai Game</button>
            <button id="resetBtn">Reset Saldo</button>
        </div>

        <div class="board">
            <div class="hand bot" id="botHand"></div>
            <div class="discard">
                <img id="discardImg" src="asets/card_back.png" alt="Kartu Buangan">
            </div>
            <div class="hand player" id="playerHand"></div>
        </div>

        <div class="actions">
            <button id="drawBtn">Ambil Kartu</button>
            <button id="unoBtn">UNO!</button>
            <p id="message"></p>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
